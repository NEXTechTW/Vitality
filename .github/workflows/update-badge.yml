name: Update Vitality Badge

on:
  # Run after every deploy so badge always reflects latest code
  workflow_run:
    workflows: ['Deploy Dashboard to GitHub Pages']
    types: [completed]
  # Also run weekly to keep badge fresh
  schedule:
    - cron: '0 2 * * 1'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js (no install needed — uses built-in node:https)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute score using dashboard algorithm
        id: score
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULT=$(node scripts/compute-badge-score.mjs NEXTechTW/Vitality)
          echo "Full result: $RESULT"
          SCORE=$(echo "$RESULT" | node -e "process.stdin.resume();let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).score));")
          echo "score=$SCORE" >> "$GITHUB_OUTPUT"
          echo "Computed score: $SCORE"

      - name: Update README badge
        run: |
          SCORE="${{ steps.score.outputs.score }}"

          # Pick badge colour to match dashboard logic
          if [ "$SCORE" -ge 90 ]; then COLOR="22c55e"
          elif [ "$SCORE" -ge 80 ]; then COLOR="84cc16"
          elif [ "$SCORE" -ge 70 ]; then COLOR="eab308"
          elif [ "$SCORE" -ge 50 ]; then COLOR="f97316"
          else COLOR="ef4444"
          fi

          PROJECT_URL="https://nextechtw.github.io/Vitality/#/projects/NEXTechTW/Vitality"

          # Safe Python replacement (avoids sed special-character issues)
          python3 - "$SCORE" "$COLOR" "$PROJECT_URL" <<'PYEOF'
          import sys, re, pathlib
          score, color, url = sys.argv[1], sys.argv[2], sys.argv[3]
          badge_url = f"https://img.shields.io/badge/Vitality_Health-{score}%2F100-{color}?style=flat-square&logo=github"
          new_line = f"[![Vitality Health Score]({badge_url})]({url})"
          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          # Match the full badge markdown: [![Vitality Health Score](...)](...)
          readme = re.sub(
              r'^\[!\[Vitality Health Score\]\(https://img\.shields\.io[^\)]*\)\]\([^\)]*\)',
              new_line, readme, flags=re.MULTILINE
          )
          pathlib.Path("README.md").write_text(readme, encoding="utf-8")
          print(f"Badge updated to score {score}")
          PYEOF

      - name: Commit and push updated badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          # Only commit if README actually changed
          git diff --cached --quiet || git commit -m "chore: update Vitality badge score [skip ci]"
          git push
